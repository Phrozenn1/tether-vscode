<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1124" />
      <stop offset="100%" stop-color="#141c38" />
    </linearGradient>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#00c6ff" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bgGrad)" stroke="#1e294b" stroke-width="3" />

  <!-- Subtle inner border ring -->
  <rect x="14" y="14" width="228" height="228" rx="50" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-opacity="0.25" />

  <!-- Glow layer for anchor -->
  <g filter="url(#glow)" opacity="0.45" stroke="#22d3ee" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <circle cx="128" cy="62" r="22" />
    <line x1="128" y1="84" x2="128" y2="198" />
    <line x1="82" y1="108" x2="174" y2="108" />
    <path d="M 52 148 Q 52 208 128 208 Q 204 208 204 148" />
  </g>

  <!-- Main Crisp Anchor (Gradient) -->
  <g stroke="url(#tealGrad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Top ring -->
    <circle cx="128" cy="62" r="22" />
    
    <!-- Vertical shank -->
    <line x1="128" y1="84" x2="128" y2="198" />
    
    <!-- Crossbar -->
    <line x1="82" y1="108" x2="174" y2="108" />
    <circle cx="82" cy="108" r="3" fill="url(#tealGrad)" />
    <circle cx="174" cy="108" r="3" fill="url(#tealGrad)" />
    
    <!-- Bottom curve -->
    <path d="M 52 148 Q 52 208 128 208 Q 204 208 204 148" />
    
    <!-- Left fluke arrow tip -->
    <path d="M 40 162 L 52 148 L 68 160" />
    
    <!-- Right fluke arrow tip -->
    <path d="M 188 160 L 204 148 L 216 162" />
  </g>

  <!-- Center anchor heart bead -->
  <circle cx="128" cy="108" r="6" fill="#38ef7d" />
</svg>
