name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Target GitHub Release tag (e.g. v1.2.0)'
        required: false
        default: 'v1.2.0'

permissions:
  contents: write

jobs:
  build-vsix:
    name: Build & Release VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies and compile TypeScript
        run: |
          npm ci
          npm run compile

      - name: Package VSIX archive
        id: pkg
        run: |
          TAG="${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || inputs.release_tag }}"
          VER="${TAG#v}"
          npx @vscode/vsce package --no-dependencies -o "tether-vscode-${VER}.vsix"
          cp "tether-vscode-${VER}.vsix" tether.vsix
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "vsix=tether-vscode-${VER}.vsix" >> "$GITHUB_OUTPUT"

      - name: Create / Upload GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        with:
          tag_name: ${{ steps.pkg.outputs.tag }}
          generate_release_notes: true
          files: |
            ${{ steps.pkg.outputs.vsix }}
            tether.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
